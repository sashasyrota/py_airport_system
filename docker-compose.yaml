services:
  airport_system:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8001:8000"
    volumes:
      - ./:/app
      - static_airport_service:/files/static
      - media_airport_service:/files/media

    command: >
      sh -c "python manage.py db_connect_check &&
            python manage.py migrate &&
            python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db_airport_service

  db_airport_service:
    image: postgres:16
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db_airport_service:$PGDATA

volumes:
  db_airport_service:
  media_airport_service:
  static_airport_service:
